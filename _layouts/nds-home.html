<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.name }}</title>
  <meta name="description" content="{{ site.description }}">
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion');
    }
  </script>
  <style>
    :root {
      --bg: #f4f3ef;
      --fg: #111111;
      --muted: #66645f;
      --rule: rgba(17,17,17,.28);
      --page: clamp(20px, 3.2vw, 56px);
      --display: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--display);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: .55; }

    .shell { padding: 0 var(--page); }
    .topbar {
      min-height: 78px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-bottom: 1px solid var(--fg);
      font-size: 13px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .brand { font-weight: 500; }
    .nav { display: flex; gap: 24px; }

    .hero {
      min-height: calc(100vh - 78px);
      padding: clamp(56px, 8vw, 120px) 0 42px;
      display: grid;
      grid-template-rows: 1fr auto;
    }
    .hero h1 {
      margin: 0;
      max-width: 15ch;
      font-size: clamp(50px, 8.7vw, 138px);
      line-height: .9;
      letter-spacing: -.055em;
      font-weight: 400;
    }
    .hero-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: end;
      font-size: clamp(15px, 1.4vw, 22px);
    }
    .hero-meta p { margin: 0; max-width: 38ch; }
    .hero-meta .scroll { justify-self: end; text-transform: uppercase; font-size: 12px; letter-spacing: .04em; }

    .section { border-top: 1px solid var(--fg); padding: 20px 0 clamp(82px, 12vw, 170px); }
    .section-head {
      display: grid;
      grid-template-columns: 90px 1fr;
      margin-bottom: clamp(48px, 8vw, 110px);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .statement {
      font-size: clamp(36px, 5.5vw, 86px);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 400;
      max-width: 20ch;
      margin: 0;
    }

    .project {
      border-top: 1px solid var(--rule);
      padding: 20px 0 0;
      display: grid;
      grid-template-columns: 90px minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 26px;
      align-items: start;
    }
    .project + .project { margin-top: 76px; }
    .project-index, .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .project h3 {
      font-size: clamp(36px, 5vw, 72px);
      line-height: .94;
      letter-spacing: -.04em;
      margin: 0 0 18px;
      font-weight: 400;
    }
    .project p { margin: 0; font-size: clamp(17px, 1.7vw, 24px); max-width: 38ch; }
    .project-meta { font-size: 13px; color: var(--muted); }
    .project-meta div { padding: 8px 0; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 16px; }

    .list { border-top: 1px solid var(--fg); }
    .list-row {
      display: grid;
      grid-template-columns: 120px minmax(0,1fr) 180px;
      gap: 24px;
      padding: 18px 0 20px;
      border-bottom: 1px solid var(--rule);
      align-items: baseline;
      transition: opacity 180ms ease;
    }
    .list-row .title {
      font-size: clamp(22px, 2.5vw, 38px);
      letter-spacing: -.025em;
      transition: transform 420ms var(--ease-out);
    }
    .list-row:hover .title { transform: translateX(8px); }
    .list-row .meta { color: var(--muted); font-size: 13px; text-align: right; }

    .about-grid { display: grid; grid-template-columns: 1.45fr .55fr; gap: 64px; }
    .about-copy { font-size: clamp(26px, 3.5vw, 52px); line-height: 1.02; letter-spacing: -.035em; margin: 0; }
    .about-small { font-size: 14px; color: var(--muted); }

    .contact-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: clamp(40px, 7vw, 110px);
      align-items: start;
    }
    .contact-identity {
      display: grid;
      grid-template-columns: minmax(120px, 190px) 1fr;
      gap: 28px;
      align-items: start;
    }
    .contact-avatar {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      filter: grayscale(100%);
    }
    .contact-identity h2 {
      margin: 0 0 20px;
      font-size: clamp(28px, 3.2vw, 52px);
      line-height: .98;
      letter-spacing: -.04em;
      font-weight: 400;
    }
    .contact-identity h2 span { color: var(--muted); }
    .contact-identity p { margin: 0; color: var(--muted); font-size: 14px; }
    .contact-links { border-top: 1px solid var(--fg); }
    .contact-links a {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 20px;
      padding: 15px 0 17px;
      border-bottom: 1px solid var(--rule);
      font-size: 14px;
      transition: opacity 180ms ease, padding-left 420ms var(--ease-out);
    }
    .contact-links a span:last-child { text-align: right; color: var(--muted); }
    .contact-links a:hover { padding-left: 8px; }

    footer {
      border-top: 1px solid var(--fg);
      padding: 22px 0 36px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .motion .topbar {
      animation: nds-fade 650ms var(--ease-out) both;
    }
    .motion .hero h1 {
      animation: nds-rise 900ms 80ms var(--ease-out) both;
    }
    .motion .hero-meta {
      animation: nds-rise 800ms 220ms var(--ease-out) both;
    }
    .motion .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 760ms var(--ease-out), transform 760ms var(--ease-out);
    }
    .motion .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @keyframes nds-rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes nds-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 760px) {
      .nav { gap: 12px; }
      .nav a:nth-child(2), .nav a:nth-child(3) { display:none; }
      .hero { min-height: 88vh; }
      .hero h1 { font-size: clamp(46px, 14vw, 76px); max-width: 12ch; }
      .hero-meta { grid-template-columns: 1fr; }
      .hero-meta .scroll { justify-self: start; }
      .section-head { grid-template-columns: 56px 1fr; }
      .project { grid-template-columns: 56px 1fr; }
      .project-meta { grid-column: 2; }
      .list-row { grid-template-columns: 72px 1fr; }
      .list-row .meta { grid-column: 2; text-align: left; }
      .about-grid, .contact-grid { grid-template-columns: 1fr; }
      .contact-identity { grid-template-columns: 110px 1fr; }
      .contact-links a { grid-template-columns: 1fr; gap: 3px; }
      .contact-links a span:last-child { text-align: left; }
      footer { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#top">Tien-Thanh Bui</a>
      <nav class="nav" aria-label="Primary">
        <a href="#work">Work</a>
        <a href="#publications">Publications</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    {{ content }}

    <footer>
      <div>© {{ 'now' | date: "%Y" }} Tien-Thanh Bui</div>
      <a href="#top">Back to top ↑</a>
    </footer>
  </div>

  <script>
    if (document.documentElement.classList.contains('motion')) {
      const items = document.querySelectorAll('.reveal');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
        items.forEach((item) => observer.observe(item));
      } else {
        items.forEach((item) => item.classList.add('is-visible'));
      }
    }
  </script>
</body>
</html>
