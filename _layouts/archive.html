layout: default
---

<section class="page-hero" id="top">

  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="page-deck">{{ page.description }}</p>{% endif %}
</section>

<section class="section-block">
  <div class="section-head"><span>I</span><span>{{ page.section_label | default: "Index" }}</span></div>
  {{ content }}
</section>
